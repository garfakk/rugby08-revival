[pytest]
testpaths = tests
addopts = -rfE --strict-markers -p no:cacheprovider
qt_api = pyqt5
filterwarnings =
    ignore::DeprecationWarning:PIL.*
markers =
    data: checks on the real data/ folder
    slow: pipeline tests (match setup to game files)
    qt: needs a QApplication (offscreen)
    game: needs the real game; always skipped
